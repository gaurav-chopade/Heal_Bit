# Install on the server as: /etc/nginx/sites-available/healbit
#   sudo ln -s /etc/nginx/sites-available/healbit /etc/nginx/sites-enabled/healbit
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS: sudo certbot --nginx -d yourdomain.com
# (certbot edits this file to add the HTTPS block and the redirect)

server {
    listen 80;
    # Replace with your domain (use "_" to answer on a bare IP address)
    server_name yourdomain.com;

    # Folder that holds the contents of frontend/dist
    root /var/www/healbit;
    index index.html;

    # Patient documents can be up to 10MB (Spring allows a 12MB request).
    # Nginx defaults to 1MB and would answer uploads with "413 Request Entity Too Large".
    client_max_body_size 12m;

    # API: /api/auth/login  ->  http://localhost:8080/auth/login
    # The trailing slash after 8080 is what strips the /api prefix,
    # because the Spring controllers are mapped without /api.
    location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset file names, so they are safe to cache for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html so React Router keeps working
    # when the user refreshes on a nested page such as /doctor/dashboard
    location / {
        try_files $uri /index.html;
    }
}
