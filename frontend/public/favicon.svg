<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Heal-Bit">
  <defs>
    <linearGradient id="hb-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14a094"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0a4f49"/>
    </linearGradient>
    <radialGradient id="hb-gloss" cx="0.78" cy="0.06" r="0.85">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#hb-tile)"/>
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#hb-gloss)"/>

  <!-- heartbeat pulse -->
  <path d="M11 34 H20 L24.5 22.5 L31.5 45 L36 34 H43"
        fill="none" stroke="#ffffff" stroke-width="4.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the "bit" -->
  <circle cx="50.5" cy="34" r="3.6" fill="#f8b09a"/>
</svg>
