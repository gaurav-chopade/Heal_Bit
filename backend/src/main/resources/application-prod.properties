# ------------------------------------------------------------
#  PRODUCTION PROFILE - active when SPRING_PROFILES_ACTIVE=prod
#  Overrides application.properties. Every secret comes from an environment
#  variable (see deploy/healbit.env.example).
#
#  A placeholder with NO default, like ${DB_URL}, makes the app refuse to start if
#  the variable is missing. That is intentional: production can never silently run
#  with a development secret. One with a trailing colon, like ${MAIL_USERNAME:},
#  is optional and becomes blank when the variable is not set.
# ------------------------------------------------------------

# Database (RDS MySQL): the full JDBC URL comes from the environment
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# No SQL logging in production (noisy and slows the app down)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# "update" creates the tables on the first deploy. Once the schema is stable,
# switch this to "validate" so Hibernate never alters a production database.
spring.jpa.hibernate.ddl-auto=update

# CORS: the public origin of the website, e.g. https://yourdomain.com
healbit.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT signing secret - generate with: openssl rand -base64 48 (32+ characters)
jwt.secret=${JWT_SECRET}

# Password of the admin account seeded on the FIRST start (only when no admin exists yet)
healbit.admin.password=${ADMIN_PASSWORD}

# reCAPTCHA secret key (must belong to the same key pair as the frontend site key)
google.recaptcha.secret=${RECAPTCHA_SECRET}

# Razorpay keys
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Cloudinary. Set CLOUDINARY_ENABLED=false to keep uploads on the server's disk instead.
cloudinary.enabled=${CLOUDINARY_ENABLED:true}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Gmail SMTP. Leave MAIL_USERNAME empty and email notifications switch themselves off.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Absolute path so uploads do not depend on the working directory
# (only used when Cloudinary is disabled; the folder must exist and be writable)
healbit.uploads.dir=/home/ubuntu/uploads/patient-documents

# Render provides the port in the PORT variable; fall back to 8080 locally
server.port=${PORT:8080}
